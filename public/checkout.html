<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout - ARS Virtual Art Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="painting.css" />
  <script src="auth.js"></script>
</head>
<body>
  <header>
    <div class="header-title">ARS Gallery</div>
    <div class="header-actions">
      <button onclick="showLoginModal()" id="loginBtn">Login</button>
      <button onclick="showSignupModal()" id="signupBtn">Sign Up</button>
      <button id="logoutBtn" style="display:none;">Logout</button>
      <div id="profileLink" style="display:none; margin-left: 10px;">
        <a href="/profile.html" style="font-weight: bold;">👤</a>
      </div>
      <div id="userDisplay" style="display: none; margin-left: 10px; color: gold; font-weight: bold;"></div>
      <div class="cart-icon" onclick="window.location.href='/cart.html'">
        🛒 <span id="cart-count">0</span>
        <a id="adminPanelLink" href="/admin.html" style="display: none; margin-left: 15px; color: gold; font-weight: bold;">Admin Panel</a>
      </div>
    </div>
  </header>
  <hr class="header-divider"/>

  <!-- Modals (Login/Signup/Alert) -->
  <div id="signupModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('signupModal')">&times;</span>
      <h2>Sign Up</h2>
      <form id="signupForm">
        <input type="text" name="username" placeholder="Username" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
        <div id="signupError" class="error-message" style="display:none;"></div>
        <div id="signupSuccess" class="success-message" style="display:none;"></div>
      </form>
    </div>
  </div>
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('loginModal')">&times;</span>
      <h2>Login</h2>
      <form id="loginForm">
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Log In</button>
        <div id="loginError" class="error-message" style="display:none;"></div>
      </form>
    </div>
  </div>
  <div id="authAlert" class="alert-popup" style="display:none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
       background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 10000;">
    <div class="alert-content" style="background: #222; color: gold; padding: 20px; border-radius: 8px; max-width: 400px; text-align: center; position: relative;">
      <span class="close-btn" style="position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: gold;">&times;</span>
      <h2>You must be logged in to checkout.</h2>
      <button id="loginRedirectBtn" class="btn" style="margin-top: 15px; background: gold; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px;">Go to Login</button>
    </div>
  </div>

  <main class="checkout-container">
    <h2>Checkout</h2>
    <div class="gallery-scroll-container" id="checkout-gallery">
      <!-- Checkout items will be dynamically added here as cards -->
    </div>
    <div class="checkout-total" style="text-align:center; margin: 30px auto; font-size:1.3rem;">
      <div>Total: <span class="total-amount">$0</span></div>
    </div>
    <div class="checkout-form" style="display: flex; justify-content: center; align-items: center;">
      <div class="modal-content" style="width: 100%; max-width: 400px;">
        <h3 style="text-align:center;">Shipping Information</h3>
        <form onsubmit="submitOrder(event)">
          <input type="text" id="full-name" placeholder="Full Name" required />
          <input type="email" id="email" placeholder="Email" required />
          <input type="tel" id="number" placeholder="Mobile Number" required />
          <input type="text" id="address" placeholder="Address" required />
          <input type="text" id="city" placeholder="City" required />
          <input type="text" id="postal-code" placeholder="Postal Code" required />
          <button class="modal-button" type="submit">Place Order</button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2025 ARS Virtual Art Gallery<br>
    All rights reserved<br>
    Designed with passion for art
  </footer>

  <script>
    // Modal/alert logic for login required
    document.querySelector('#authAlert .close-btn').onclick = function() {
      // Only allow closing if user is logged in
      if (checkUserLoggedIn()) {
        document.getElementById('authAlert').style.display = 'none';
      }
    };
    document.getElementById('loginRedirectBtn').onclick = function () {
      document.getElementById('authAlert').style.display = 'none';
      showLoginModal();
    };
    function showLoginModal() {
      document.getElementById('loginModal').style.display = 'flex';
    }
    function showSignupModal() {
      document.getElementById('signupModal').style.display = 'flex';
    }
    // Login form error handling (copied from paintings.html)
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const loginError = document.getElementById('loginError');
      loginError.style.display = 'none';
      const formData = new FormData(this);
      const data = {
        username: formData.get('username'),
        password: formData.get('password'),
      };
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'include'
        });
        if (res.ok) {
          // Fetch user info after login
          const meRes = await fetch('/me', { method: 'GET', credentials: 'include' });
          if (meRes.ok) {
            const meData = await meRes.json();
            localStorage.setItem('user', JSON.stringify(meData.user));
            if (typeof updateLoginUI === 'function') updateLoginUI();
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('signupModal').style.display = 'none';
            document.getElementById('loginForm').reset();
            document.getElementById('signupForm').reset();
            updateCartCount();
            fetchAndRenderCheckoutCart?.();
          }
        } else {
          const errorText = await res.text();
          loginError.textContent = errorText || 'Login failed';
          loginError.style.display = 'block';
        }
      } catch (error) {
        loginError.textContent = 'Network error';
        loginError.style.display = 'block';
      }
    });
    // Signup form error handling (copied from paintings.html)
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const signupError = document.getElementById('signupError');
      const signupSuccess = document.getElementById('signupSuccess');
      signupError.style.display = 'none';
      signupSuccess.style.display = 'none';
      const formData = new FormData(this);
      const data = {
        username: formData.get('username'),
        email: formData.get('email'),
        password: formData.get('password'),
      };
      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'include'
        });
        if (res.ok) {
          // Auto-login after signup
          const loginRes = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: data.username, password: data.password }),
            credentials: 'include'
          });
          if (loginRes.ok) {
            const meRes = await fetch('/me', { method: 'GET', credentials: 'include' });
            if (meRes.ok) {
              const meData = await meRes.json();
              localStorage.setItem('user', JSON.stringify(meData.user));
              if (typeof updateLoginUI === 'function') updateLoginUI();
              document.getElementById('loginModal').style.display = 'none';
              document.getElementById('signupModal').style.display = 'none';
              document.getElementById('loginForm').reset();
              document.getElementById('signupForm').reset();
              updateCartCount();
              fetchAndRenderCheckoutCart?.();
            }
            signupSuccess.textContent = 'Signup successful and logged in!';
            signupSuccess.style.display = 'block';
          }
        } else {
          const errorText = await res.text();
          signupError.textContent = errorText || 'Registration failed';
          signupError.style.display = 'block';
        }
      } catch (error) {
        signupError.textContent = 'Network error';
        signupError.style.display = 'block';
      }
    });
    // Disable closing login modal if not logged in and login-required popup is open
    document.querySelector('#loginModal .close').onclick = function() {
      if (checkUserLoggedIn()) {
        document.getElementById('loginModal').style.display = 'none';
      }
    };
    function closeModal(modalId) {
      if (modalId === 'loginModal' && !checkUserLoggedIn()) return;
      document.getElementById(modalId).style.display = 'none';
    }
    // Robust logout logic for all pages
    async function logoutUser() {
      await fetch('/logout', { method: 'POST', credentials: 'include' });
      localStorage.removeItem('user');
      if (typeof updateLoginUI === 'function') updateLoginUI();
      window.location.href = '/paintings.html';
    }
    document.getElementById('logoutBtn').onclick = () => logoutUser();

    // Fetch and render checkout cart from backend in real time
    async function fetchAndRenderCheckoutCart() {
      const urlParams = new URLSearchParams(window.location.search);
      const buyNowId = urlParams.get('buyNow');
      let cart = [];
      if (buyNowId) {
        // Fetch single painting for buy now
        const res = await fetch(`/api/paintings`);
        if (res.ok) {
          const paintings = await res.json();
          const painting = paintings.find(p => p._id === buyNowId);
          if (painting) {
            cart = [{ ...painting, quantity: 1 }];
          }
        }
      } else {
        // Fetch full cart
        const res = await fetch('/cart', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          cart = (data.cart || []).map(item => ({
            _id: item.productId._id,
            title: item.productId.title,
            price: item.productId.price,
            image: item.productId.image,
            quantity: item.quantity
          }));
        }
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      const gallery = document.getElementById('checkout-gallery');
      gallery.innerHTML = '';
      let total = 0;
      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        const card = document.createElement('div');
        card.classList.add('painting-card');
        card.innerHTML = `
          <img src="${item.image || 'images/default.jpg'}" alt="${item.title}" />
          <div class="painting-title">${item.title}</div>
          <div class="painting-price">Unit Price: ${item.price}</div>
          <div class="painting-quantity">Quantity: <input type="number" value="${item.quantity}" min="1" style="width:60px; margin-bottom:8px;" onchange="updateCheckoutQuantity(this, ${index})" ${buyNowId ? 'disabled' : ''} /></div>
          <div class="painting-item-total">Item Total: $<span id="item-total-${index}">${itemTotal.toFixed(2)}</span></div>
        `;
        gallery.appendChild(card);
        total += itemTotal;
      });
      document.querySelector('.total-amount').textContent = `${total.toFixed(2)}`;
      updateCartCount();
    }

    async function updateCheckoutQuantity(input, index) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      let newQuantity = parseInt(input.value);
      if (isNaN(newQuantity) || newQuantity < 1) {
        newQuantity = 1;
        input.value = 1;
      }
      // Only update if not in Buy Now mode
      const urlParams = new URLSearchParams(window.location.search);
      const buyNowId = urlParams.get('buyNow');
      if (!buyNowId) {
        cart[index].quantity = newQuantity;
        localStorage.setItem('cart', JSON.stringify(cart));
        if (checkUserLoggedIn()) await syncCartToBackend();
      }
      await fetchAndRenderCheckoutCart();
      updateCartCount();
    }

    // On page load, block if not logged in
    window.onload = function() {
      if (typeof initAuthUI === 'function') initAuthUI();
      if (!checkUserLoggedIn()) {
        document.getElementById('authAlert').style.display = 'flex';
        return;
      }
      fetchAndRenderCheckoutCart();
      updateCartCount();
    }

    // Order submission logic (redirect to order summary)
    async function submitOrder(event) {
      event.preventDefault();
      const shippingInfo = {
        name: document.getElementById('full-name').value,
        email: document.getElementById('email').value,
        number: document.getElementById('number').value,
        address: document.getElementById('address').value,
        city: document.getElementById('city').value,
        postalCode: document.getElementById('postal-code').value
      };
      let items = [];
      const urlParams = new URLSearchParams(window.location.search);
      const buyNowId = urlParams.get('buyNow');
      if (buyNowId) {
        // Fetch single painting for buy now
        const res = await fetch(`/api/paintings`);
        if (res.ok) {
          const paintings = await res.json();
          const painting = paintings.find(p => p._id === buyNowId);
          if (painting) {
            items = [{ ...painting, quantity: 1 }];
          }
        }
      } else {
        // Fetch full cart
        const resCart = await fetch('/cart', { credentials: 'include' });
        if (resCart.ok) {
          const data = await resCart.json();
          items = (data.cart || []).map(item => ({
            _id: item.productId._id,
            title: item.productId.title,
            price: item.productId.price,
            image: item.productId.image,
            quantity: item.quantity
          }));
        }
      }
      try {
        const res = await fetch('/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ shippingInfo, items })
        });
        if (res.ok) {
          const data = await res.json();
          window.location.href = `/ordersumm.html?orderId=${data.orderId}`;
          if (items.length) localStorage.removeItem('cart');
          document.querySelector('form').reset();
          updateCartCount();
        } else {
          const msg = await res.text();
          alert('Checkout failed: ' + msg);
        }
      } catch (err) {
        console.error(err);
        alert('An error occurred while processing your order.');
      }
    }
  </script>
  <script src="auth.js"></script>
</body>
</html>
