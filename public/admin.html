<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Manage Paintings</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="painting.css" />
  <script src="auth.js"></script>
</head>
<body>
  <header>
    <div class="header-title">ARS Gallery</div>
    <div class="header-actions">
      <button onclick="showLoginModal()" id="loginBtn">Login</button>
      <button onclick="showSignupModal()" id="signupBtn">Sign Up</button>
      <button id="logoutBtn" style="display:none;">Logout</button>
      <div id="profileLink" style="display:none; margin-left: 10px;">
        <a href="/profile.html" style="font-weight: bold;">👤</a>
      </div>
      <div id="userDisplay" style="display: none; margin-left: 10px; color: gold; font-weight: bold;"></div>
      <div class="cart-icon" onclick="window.location.href='/cart.html'">
        🛒 <span id="cart-count">0</span>
        <a id="adminPanelLink" href="/admin.html" style="display: none; margin-left: 15px; color: gold; font-weight: bold;">Admin Panel</a>
      </div>
    </div>
  </header>
  <hr class="header-divider"/>

  <!-- Modals (Login/Signup/Alert) -->
  <div id="signupModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('signupModal')">&times;</span>
      <h2>Sign Up</h2>
      <form id="signupForm">
        <input type="text" name="username" placeholder="Username" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
        <div id="signupError" class="error-message" style="display:none;"></div>
        <div id="signupSuccess" class="success-message" style="display:none;"></div>
      </form>
    </div>
  </div>
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('loginModal')">&times;</span>
      <h2>Login</h2>
      <form id="loginForm">
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Log In</button>
        <div id="loginError" class="error-message" style="display:none;"></div>
      </form>
    </div>
  </div>
  <div id="authAlert" class="alert-popup" style="display:none;">
    <div class="alert-content">
      <span class="close-btn" style="position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: gold;">&times;</span>
      <h2>You must be logged in as admin to access this page.</h2>
      <button id="loginRedirectBtn" class="btn" style="margin-top: 15px; background: gold; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px;">Go to Login</button>
    </div>
  </div>

  <main>
    <section class="form-section">
      <h2>Add New Painting</h2>
      <form id="paintingForm" enctype="multipart/form-data">
        <input type="text" name="title" placeholder="Title" required />
        <input type="number" name="price" placeholder="Price" required />
        <textarea name="description" placeholder="Description" required></textarea>
        <input type="file" name="image" accept="image/*" required />
        <button type="submit">Upload</button>
      </form>
      <div id="formMessage"></div>
    </section>
    <section class="paintings-list">
      <h2>All Paintings</h2>
      <div id="paintingsContainer"></div>
    </section>
  </main>

  <footer>
    &copy; 2025 ARS Virtual Art Gallery<br>
    All rights reserved<br>
    Designed with passion for art
  </footer>

  <script>
    // Modal/alert logic (reuse from paintings.html)
    document.querySelector('#authAlert .close-btn').onclick = function() {
      // Only allow closing if user is logged in
      if (checkUserLoggedIn()) {
        document.getElementById('authAlert').style.display = 'none';
      }
    };
    document.getElementById('loginRedirectBtn').onclick = function () {
      document.getElementById('authAlert').style.display = 'none';
      showLoginModal();
    };
    function showLoginModal() {
      document.getElementById('loginModal').style.display = 'flex';
    }
    function showSignupModal() {
      document.getElementById('signupModal').style.display = 'flex';
    }
    // Login form error handling (copied from paintings.html)
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const loginError = document.getElementById('loginError');
      loginError.style.display = 'none';
      const formData = new FormData(this);
      const data = {
        username: formData.get('username'),
        password: formData.get('password'),
      };
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'include'
        });
        if (res.ok) {
          // Fetch user info after login
          const meRes = await fetch('/me', { method: 'GET', credentials: 'include' });
          if (meRes.ok) {
            const meData = await meRes.json();
            localStorage.setItem('user', JSON.stringify(meData.user));
            if (typeof updateLoginUI === 'function') updateLoginUI();
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('signupModal').style.display = 'none';
            document.getElementById('loginForm').reset();
            document.getElementById('signupForm').reset();
            updateCartCount();
          }
        } else {
          const errorText = await res.text();
          loginError.textContent = errorText || 'Login failed';
          loginError.style.display = 'block';
        }
      } catch (error) {
        loginError.textContent = 'Network error';
        loginError.style.display = 'block';
      }
    });
    // Signup form error handling (copied from paintings.html)
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const signupError = document.getElementById('signupError');
      const signupSuccess = document.getElementById('signupSuccess');
      signupError.style.display = 'none';
      signupSuccess.style.display = 'none';
      const formData = new FormData(this);
      const data = {
        username: formData.get('username'),
        email: formData.get('email'),
        password: formData.get('password'),
      };
      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'include'
        });
        if (res.ok) {
          // Auto-login after signup
          const loginRes = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: data.username, password: data.password }),
            credentials: 'include'
          });
          if (loginRes.ok) {
            const meRes = await fetch('/me', { method: 'GET', credentials: 'include' });
            if (meRes.ok) {
              const meData = await meRes.json();
              localStorage.setItem('user', JSON.stringify(meData.user));
              if (typeof updateLoginUI === 'function') updateLoginUI();
              document.getElementById('loginModal').style.display = 'none';
              document.getElementById('signupModal').style.display = 'none';
              document.getElementById('loginForm').reset();
              document.getElementById('signupForm').reset();
              updateCartCount();
            }
            signupSuccess.textContent = 'Signup successful and logged in!';
            signupSuccess.style.display = 'block';
          }
        } else {
          const errorText = await res.text();
          signupError.textContent = errorText || 'Registration failed';
          signupError.style.display = 'block';
        }
      } catch (error) {
        signupError.textContent = 'Network error';
        signupError.style.display = 'block';
      }
    });
    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }
    // Check login state and show login required popup if not logged in
    if (!checkUserLoggedIn()) {
      document.getElementById('authAlert').style.display = 'flex';
      return;
    }
    // Check user role on page load
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'admin') {
      document.getElementById('authAlert').style.display = 'flex';
      return;
    }
    // Fetch and display paintings
    async function fetchPaintings() {
      const res = await fetch('/api/paintings');
      const paintings = await res.json();
      const container = document.getElementById('paintingsContainer');
      container.innerHTML = '';
      paintings.forEach(p => {
        const div = document.createElement('div');
        div.className = 'painting-entry';
        div.innerHTML = `
          <img src="${p.image}" alt="${p.title}" width="100" />
          <div>
            <strong>${p.title}</strong><br>
            ${p.price}<br>
            <em>${p.description}</em><br>
            <button onclick="deletePainting('${p._id}')">Delete</button>
          </div>
        `;
        container.appendChild(div);
      });
      updateCartCount();
    }
    // Delete painting function
    async function deletePainting(id) {
      if (!confirm('Are you sure you want to delete this painting?')) return;
      const res = await fetch(`/api/paintings/${id}`, { method: 'DELETE' });
      if (res.ok) {
        alert('Painting deleted successfully.');
        fetchPaintings();
      } else {
        alert('Failed to delete painting.');
      }
    }
    // Handle form submission
    document.getElementById('paintingForm').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      const res = await fetch('/api/paintings', {
        method: 'POST',
        body: data
      });
      const msg = document.getElementById('formMessage');
      if (res.ok) {
        msg.textContent = '✅ Painting added successfully!';
        msg.className = 'success';
        form.reset();
        fetchPaintings();
      } else {
        msg.textContent = '❌ Failed to upload painting.';
        msg.className = 'error';
      }
    };
    // Logout button click handler
    document.getElementById('logoutBtn').onclick = () => {
      logoutUser();
    };
    // Initial fetch on page load
    fetchPaintings();
  </script>
  <script src="auth.js"></script>
</body>
</html>
