<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart - ARS Virtual Art Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="painting.css" />
  <script src="auth.js"></script>
</head>
<body>
  <header>
    <div class="header-title">ARS Gallery</div>
    <div class="header-actions">
      <button onclick="showLoginModal()" id="loginBtn">Login</button>
      <button onclick="showSignupModal()" id="signupBtn">Sign Up</button>
      <button id="logoutBtn" style="display:none;">Logout</button>
      <div id="profileLink" style="display:none; margin-left: 10px;">
        <a href="/profile.html" style="font-weight: bold;">👤</a>
      </div>
      <div id="userDisplay" style="display: none; margin-left: 10px; color: gold; font-weight: bold;"></div>
      <div class="cart-icon" onclick="window.location.href='/cart.html'">
        🛒 <span id="cart-count">0</span>
        <a id="adminPanelLink" href="/admin.html" style="display: none; margin-left: 15px; color: gold; font-weight: bold;">Admin Panel</a>
      </div>
    </div>
  </header>
  <hr class="header-divider"/>

  <!-- Modals (Login/Signup/Alert) -->
  <div id="signupModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('signupModal')">&times;</span>
      <h2>Sign Up</h2>
      <form id="signupForm">
        <input type="text" name="username" placeholder="Username" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
        <div id="signupError" class="error-message" style="display:none;"></div>
        <div id="signupSuccess" class="success-message" style="display:none;"></div>
      </form>
    </div>
  </div>
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('loginModal')">&times;</span>
      <h2>Login</h2>
      <form id="loginForm">
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Log In</button>
        <div id="loginError" class="error-message" style="display:none;"></div>
      </form>
    </div>
  </div>
  <div id="authAlert" class="modal" style="display:none; align-items:center; justify-content:center;">
    <div class="modal-content">
      <span class="close-btn" style="position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: gold;">&times;</span>
      <h2>You must be logged in to buy or add items to the cart.</h2>
      <button id="loginRedirectBtn" class="modal-button">Go to Login</button>
    </div>
  </div>

  <main>
    <h2 style="text-align:center; margin-top:30px;">Your Cart</h2>
    <div class="gallery-scroll-container" id="cart-gallery">
      <!-- Cart items will be dynamically added here as cards -->
    </div>
    <div class="cart-total" style="text-align:center; margin: 30px auto; font-size:1.3rem;">
      <div>Total: <span class="total-amount">$0</span></div>
      <button class="modal-button" onclick="window.location.href='/checkout.html'" style="margin-top:20px;">Proceed to Checkout</button>
    </div>
  </main>

  <footer>
    &copy; 2025 ARS Virtual Art Gallery<br>
    All rights reserved<br>
    Designed with passion for art
  </footer>

  <script>
    // Modal/alert logic (reuse from paintings.html)
    document.querySelector('#authAlert .close-btn').onclick = function() {
      // Only allow closing if user is logged in
      if (checkUserLoggedIn()) {
        document.getElementById('authAlert').style.display = 'none';
      }
    };
    document.getElementById('loginRedirectBtn').onclick = function () {
      document.getElementById('authAlert').style.display = 'none';
      showLoginModal();
    };
    function showLoginModal() {
      document.getElementById('loginModal').style.display = 'flex';
    }
    function showSignupModal() {
      document.getElementById('signupModal').style.display = 'flex';
    }
    // Login form error handling (copied from paintings.html)
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const loginError = document.getElementById('loginError');
      loginError.style.display = 'none';
      const formData = new FormData(this);
      const data = {
        username: formData.get('username'),
        password: formData.get('password'),
      };
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'include'
        });
        if (res.ok) {
          // Fetch user info after login
          const meRes = await fetch('/me', { method: 'GET', credentials: 'include' });
          if (meRes.ok) {
            const meData = await meRes.json();
            localStorage.setItem('user', JSON.stringify(meData.user));
            if (typeof updateLoginUI === 'function') updateLoginUI();
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('signupModal').style.display = 'none';
            document.getElementById('loginForm').reset();
            document.getElementById('signupForm').reset();
            updateCartCount();
            fetchAndRenderCart?.();
          }
        } else {
          const errorText = await res.text();
          loginError.textContent = errorText || 'Login failed';
          loginError.style.display = 'block';
        }
      } catch (error) {
        loginError.textContent = 'Network error';
        loginError.style.display = 'block';
      }
    });
    // Signup form error handling (copied from paintings.html)
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const signupError = document.getElementById('signupError');
      const signupSuccess = document.getElementById('signupSuccess');
      signupError.style.display = 'none';
      signupSuccess.style.display = 'none';
      const formData = new FormData(this);
      const data = {
        username: formData.get('username'),
        email: formData.get('email'),
        password: formData.get('password'),
      };
      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'include'
        });
        if (res.ok) {
          // Auto-login after signup
          const loginRes = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: data.username, password: data.password }),
            credentials: 'include'
          });
          if (loginRes.ok) {
            const meRes = await fetch('/me', { method: 'GET', credentials: 'include' });
            if (meRes.ok) {
              const meData = await meRes.json();
              localStorage.setItem('user', JSON.stringify(meData.user));
              if (typeof updateLoginUI === 'function') updateLoginUI();
              document.getElementById('loginModal').style.display = 'none';
              document.getElementById('signupModal').style.display = 'none';
              document.getElementById('loginForm').reset();
              document.getElementById('signupForm').reset();
              updateCartCount();
              fetchAndRenderCart?.();
            }
            signupSuccess.textContent = 'Signup successful and logged in!';
            signupSuccess.style.display = 'block';
          }
        } else {
          const errorText = await res.text();
          signupError.textContent = errorText || 'Registration failed';
          signupError.style.display = 'block';
        }
      } catch (error) {
        signupError.textContent = 'Network error';
        signupError.style.display = 'block';
      }
    });
    // Disable closing login/signup modal if not logged in and login-required popup is open
    document.querySelector('#loginModal .close').onclick = function() {
      if (checkUserLoggedIn()) {
        document.getElementById('loginModal').style.display = 'none';
      }
    };
    document.querySelector('#signupModal .close').onclick = function() {
      if (checkUserLoggedIn()) {
        document.getElementById('signupModal').style.display = 'none';
      }
    };
    function closeModal(modalId) {
      if ((modalId === 'loginModal' || modalId === 'signupModal') && !checkUserLoggedIn()) return;
      document.getElementById(modalId).style.display = 'none';
    }
    // Robust logout logic for all pages
    async function logoutUser() {
      await fetch('/logout', { method: 'POST', credentials: 'include' });
      localStorage.removeItem('user');
      if (typeof updateLoginUI === 'function') updateLoginUI();
      window.location.href = '/paintings.html';
    }
    document.getElementById('logoutBtn').onclick = () => logoutUser();

    // Fetch and render cart from backend in real time
    async function fetchAndRenderCart() {
      const res = await fetch('/cart', { credentials: 'include' });
      if (!res.ok) return;
      const data = await res.json();
      const cart = (data.cart || []).map(item => ({
        _id: item.productId._id,
        title: item.productId.title,
        price: item.productId.price,
        image: item.productId.image,
        quantity: item.quantity
      }));
      localStorage.setItem('cart', JSON.stringify(cart));
      const gallery = document.getElementById('cart-gallery');
      gallery.innerHTML = '';
      let totalAmount = 0;
      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        const card = document.createElement('div');
        card.classList.add('painting-card');
        card.innerHTML = `
          <img src="${item.image || 'images/default.jpg'}" alt="${item.title}" />
          <div class="painting-title">${item.title}</div>
          <div class="painting-price">Unit Price: ${item.price}</div>
          <div class="painting-quantity">Quantity: <input type="number" value="${item.quantity}" min="1" style="width:60px; margin-bottom:8px;" onchange="updateQuantity(this, ${index})" /></div>
          <div class="painting-item-total">Item Total: $<span id="item-total-${index}">${itemTotal.toFixed(2)}</span></div>
          <div class="painting-actions">
            <button class="modal-button" onclick="removeFromCart(${index})">Remove</button>
          </div>
        `;
        gallery.appendChild(card);
        totalAmount += itemTotal;
      });
      document.querySelector('.total-amount').textContent = `${totalAmount.toFixed(2)}`;
      updateCartCount(); // Real-time cart count update
    }

    // Always sync cart to backend and update UI after add/remove/quantity change
    async function syncAndRenderCart() {
      if (checkUserLoggedIn()) await syncCartToBackend();
      await fetchAndRenderCart();
      updateCartCount();
    }

    async function updateQuantity(input, index) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const newQuantity = parseInt(input.value);
      if (isNaN(newQuantity) || newQuantity < 1) {
        input.value = 1;
        updateCartCount();
        return;
      }
      cart[index].quantity = newQuantity;
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount(); // Real-time update before sync
      await syncAndRenderCart();
    }
    async function removeFromCart(index) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      await syncAndRenderCart();
    }
    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cart-count').textContent = totalItems;
    }
    // On page load
    window.onload = function() {
      if (typeof initAuthUI === 'function') initAuthUI();
      // Check login state and show login required popup if not logged in
      if (!checkUserLoggedIn()) {
        document.getElementById('authAlert').style.display = 'flex';
        return;
      }
      fetchAndRenderCart();
      updateCartCount();
    }
  </script>
  <script src="auth.js"></script>
</body>
</html>
