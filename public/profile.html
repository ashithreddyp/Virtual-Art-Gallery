<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Profile - ARS Virtual Art Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="profile.css" />
  <script src="auth.js"></script>
</head>
<body>
  <header>
    <div class="header-title">ARS Gallery</div>
    <div class="header-actions">
      <button onclick="showLoginModal()" id="loginBtn">Login</button>
      <button onclick="showSignupModal()" id="signupBtn">Sign Up</button>
      <button id="logoutBtn" style="display:none;">Logout</button>
      <div id="profileLink" style="display:none; margin-left: 10px;">
        <a href="/profile.html" style="font-weight: bold;">👤</a>
      </div>
      <div id="userDisplay" style="display: none; margin-left: 10px; color: gold; font-weight: bold;"></div>
      <div class="cart-icon" onclick="window.location.href='/cart.html'">
        🛒 <span id="cart-count">0</span>
        <a id="adminPanelLink" href="/admin.html" style="display: none; margin-left: 15px; color: gold; font-weight: bold;">Admin Panel</a>
      </div>
    </div>
  </header>
  <hr class="header-divider"/>

  <!-- Modals (Login/Signup/Alert) -->
  <div id="signupModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('signupModal')">&times;</span>
      <h2>Sign Up</h2>
      <form id="signupForm">
        <input type="text" name="username" placeholder="Username" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
        <div id="signupError" class="error-message" style="display:none;"></div>
        <div id="signupSuccess" class="success-message" style="display:none;"></div>
      </form>
    </div>
  </div>
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('loginModal')">&times;</span>
      <h2>Login</h2>
      <form id="loginForm">
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Log In</button>
        <div id="loginError" class="error-message" style="display:none;"></div>
      </form>
    </div>
  </div>
  <div id="authAlert" class="alert-popup" style="display:none;">
    <div class="alert-content">
      <span class="close-btn" style="position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: gold;">&times;</span>
      <h2>You must be logged in to view your profile.</h2>
      <button id="loginRedirectBtn" class="btn" style="margin-top: 15px; background: gold; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px;">Go to Login</button>
    </div>
  </div>

  <main class="profile-container">
    <h2>Welcome, <span id="username"></span></h2>
    <section class="user-info">
      <h3>Your Information</h3>
      <p>Email: <span id="user-email"></span></p>
      <p>Shipping Address: <span id="user-address"></span></p>
    </section>
    <section class="user-cart">
      <h3>Your Cart</h3>
      <div id="cart-list"></div>
    </section>
    <section id="ordersSection">
  <h2>Your Orders</h2>
  <div id="ordersList" class="order-list"></div>
</section>
    <button id="logout-btn" onclick="logoutUser()">Logout</button>
  </main>

  <footer>
    &copy; 2025 ARS Virtual Art Gallery<br>
    All rights reserved<br>
    Designed with passion for art
  </footer>

  <script>
    // Modal/alert logic (reuse from paintings.html)
    document.querySelector('#authAlert .close-btn').onclick = function() {
      // Only allow closing if user is logged in
      if (checkUserLoggedIn()) {
        document.getElementById('authAlert').style.display = 'none';
      }
    };
    document.getElementById('loginRedirectBtn').onclick = function () {
      document.getElementById('authAlert').style.display = 'none';
      showLoginModal();
    };
    function showLoginModal() {
      document.getElementById('loginModal').style.display = 'flex';
    }
    function showSignupModal() {
      document.getElementById('signupModal').style.display = 'flex';
    }
    // Login form error handling (copied from paintings.html)
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const loginError = document.getElementById('loginError');
      loginError.style.display = 'none';
      const formData = new FormData(this);
      const data = {
        username: formData.get('username'),
        password: formData.get('password'),
      };
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'include'
        });
        if (res.ok) {
          // Fetch user info after login
          const meRes = await fetch('/me', { method: 'GET', credentials: 'include' });
          if (meRes.ok) {
            const meData = await meRes.json();
            localStorage.setItem('user', JSON.stringify(meData.user));
            if (typeof updateLoginUI === 'function') updateLoginUI();
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('signupModal').style.display = 'none';
            document.getElementById('loginForm').reset();
            document.getElementById('signupForm').reset();
            updateCartCount();
            fetchUserCart?.();
          }
        } else {
          const errorText = await res.text();
          loginError.textContent = errorText || 'Login failed';
          loginError.style.display = 'block';
        }
      } catch (error) {
        loginError.textContent = 'Network error';
        loginError.style.display = 'block';
      }
    });
    // Signup form error handling (copied from paintings.html)
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const signupError = document.getElementById('signupError');
      const signupSuccess = document.getElementById('signupSuccess');
      signupError.style.display = 'none';
      signupSuccess.style.display = 'none';
      const formData = new FormData(this);
      const data = {
        username: formData.get('username'),
        email: formData.get('email'),
        password: formData.get('password'),
      };
      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'include'
        });
        if (res.ok) {
          // Auto-login after signup
          const loginRes = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: data.username, password: data.password }),
            credentials: 'include'
          });
          if (loginRes.ok) {
            const meRes = await fetch('/me', { method: 'GET', credentials: 'include' });
            if (meRes.ok) {
              const meData = await meRes.json();
              localStorage.setItem('user', JSON.stringify(meData.user));
              if (typeof updateLoginUI === 'function') updateLoginUI();
              document.getElementById('loginModal').style.display = 'none';
              document.getElementById('signupModal').style.display = 'none';
              document.getElementById('loginForm').reset();
              document.getElementById('signupForm').reset();
              updateCartCount();
              fetchUserCart?.();
            }
            signupSuccess.textContent = 'Signup successful and logged in!';
            signupSuccess.style.display = 'block';
          }
        } else {
          const errorText = await res.text();
          signupError.textContent = errorText || 'Registration failed';
          signupError.style.display = 'block';
        }
      } catch (error) {
        signupError.textContent = 'Network error';
        signupError.style.display = 'block';
      }
    });
    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }
    // Fetch user details on page load
    window.onload = function() {
      if (typeof initAuthUI === 'function') initAuthUI();
      // Check login state and show login required popup if not logged in
      if (!checkUserLoggedIn()) {
        document.getElementById('authAlert').style.display = 'flex';
        return;
      }
      fetchUserProfile();
      fetchUserOrders();
      fetchUserCart();
      updateCartCount?.();
      fetchOrderHistory();
    };
    // Fetch user profile details
    function fetchUserProfile() {
      fetch('/profile')
        .then(res => res.json())
        .then(data => {
          document.getElementById('username').textContent = data.username;
          document.getElementById('user-email').textContent = data.email;
          document.getElementById('user-address').textContent = data.address || 'Not provided';
        })
        .catch(err => console.error('Error fetching user profile:', err));
    }
    // Fetch user orders
    function fetchUserOrders() {
      fetch('/orders')
        .then(res => res.json())
        .then(data => {
          const ordersList = document.getElementById('orders-list');
          if (data.orders.length === 0) {
            ordersList.innerHTML = '<p>No orders found.</p>';
          } else {
            data.orders.forEach(order => {
              const orderDiv = document.createElement('div');
              orderDiv.classList.add('order');
              orderDiv.innerHTML = `
                <div>Order Date: ${new Date(order.date).toLocaleDateString()}</div>
                <div>Status: ${order.status}</div>
                <div>Items: 
                  <ul>
                    ${order.items.map(item => `<li>${item.productId.title} (x${item.quantity})</li>`).join('')}
                  </ul>
                </div>
              `;
              ordersList.appendChild(orderDiv);
            });
          }
        })
        .catch(err => console.error('Error fetching orders:', err));
    }
    // Fetch user cart
    function fetchUserCart() {
      fetch('/cart')
        .then(res => res.json())
        .then(data => {
          const cartList = document.getElementById('cart-list');
          if (data.cart.length === 0) {
            cartList.innerHTML = '<p>No items in cart.</p>';
          } else {
            data.cart.forEach(item => {
              const cartItemDiv = document.createElement('div');
              cartItemDiv.classList.add('cart-item');
              cartItemDiv.innerHTML = `
                <div>${item.productId.title} (x${item.quantity})</div>
                <div>Price: ${item.productId.price}</div>
              `;
              cartList.appendChild(cartItemDiv);
            });
          }
          updateCartCount();
        })
        .catch(err => console.error('Error fetching cart:', err));
    }
    // Logout function
    // Remove custom logoutUser, use shared logoutUser from auth.js
    // Order history rendering
    function renderOrders(orders) {
      const container = document.getElementById('order-list');
      container.innerHTML = '';
      if (!orders || orders.length === 0) {
        container.innerHTML = '<p>No past orders.</p>';
        return;
      }
      orders.forEach(order => {
        const orderDiv = document.createElement('div');
        orderDiv.classList.add('order');
        const itemsHTML = order.items.map(item => `
          <div class="order-item">
            <img src="${item.productId.image}" alt="${item.productId.title}" />
            <div>
              <div><strong>${item.productId.title}</strong></div>
              <div>Quantity: ${item.quantity}</div>
              <div>Price: $${item.productId.price.toFixed(2)}</div>
            </div>
          </div>
        `).join('');
        orderDiv.innerHTML = `
          <div class="order-date">Order placed on ${new Date(order.createdAt).toLocaleDateString()}</div>
          <div class="order-items">${itemsHTML}</div>
          <div class="order-total"><strong>Total: $${order.total ? order.total.toFixed(2) : 'N/A'}</strong></div>
          <hr>
        `;
        container.appendChild(orderDiv);
      });
    }
    function fetchOrderHistory() {
      fetch('/orders')
        .then(res => res.json())
        .then(data => renderOrders(data.orders))
        .catch(err => console.error('Error fetching order history:', err));
    }
    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cart-count').textContent = totalItems;
    }
    async function fetchAndRenderUserOrders() {
  try {
    const res = await fetch('/my-orders', { credentials: 'include' });
    if (!res.ok) throw new Error('Failed to fetch orders');

    const { orders } = await res.json();
    const container = document.getElementById('ordersList');
    if (!orders.length) {
      container.innerHTML = '<p>No orders yet.</p>';
      return;
    }

    container.innerHTML = orders.map(order => {
      const itemsHTML = order.items.map(it => {
        const product = it.productId;
        return `<li>${product.title || 'Untitled'} × ${it.quantity}</li>`;
      }).join('');

      return `
        <div class="order-card">
          <h3>Order #${order._id.slice(-6)}</h3>
          <p>Status: <strong>${order.status}</strong></p>
          ${order.confirmedAt ? `<p>Confirmed on: ${new Date(order.confirmedAt).toLocaleString()}</p>` : ''}
          <ul>${itemsHTML}</ul>
          <a href="/ordersumm.html?orderId=${order._id}" class="view-order-btn">View Details</a>
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error('Error loading orders:', err);
    document.getElementById('ordersList').innerHTML = '<p>Could not load orders.</p>';
  }
}
window.onload = function () {
  if (typeof initAuthUI === 'function') initAuthUI();

  const isLoggedIn = checkUserLoggedIn();

  // Hide modals unless explicitly triggered
  document.getElementById('loginModal').style.display = 'none';
  document.getElementById('signupModal').style.display = 'none';

  if (!isLoggedIn) {
    document.getElementById('authAlert').style.display = 'flex';
    return;
  }

  // If logged in, fetch data
  fetchUserProfile();
  fetchUserOrders();
  fetchUserCart();
  updateCartCount?.();
  fetchOrderHistory();
};

document.addEventListener('DOMContentLoaded', fetchAndRenderUserOrders);

  </script>
  <script src="auth.js"></script>
</body>
</html>
