<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARS - Virtual Art Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="footer-background-section">
    <div class="calligraphic">ARS</div>
    <div class="calligraphic-tagline">Emphasize the connection with art</div>
    <div class="welcome-message">Welcome to the world of creativity</div>
  </div>

  <footer>
    &copy; 2025 ARS Virtual Art Gallery<br />
    All rights reserved<br />
    Designed with passion for art
  </footer>

  <script>
    // Prevent blinking cursor on click
    document.body.addEventListener('click', function (e) {
      if (document.activeElement && document.activeElement !== document.body) {
        document.activeElement.blur();
      }
    });
  </script>

  <!-- Transition script -->
  <script src="script.js"></script>
</body>
</html>
